<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO 通用行业内容工作台</title>
<style>
:root{
  --bg:#0a0a1a; --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.09); --txt:#e8e6f5; --dim:#9a96b8;
  --gold:#d4a843; --purple:#8b6cf0; --green:#3ecf8e; --red:#f0606c; --blue:#5b8cf6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",sans-serif;min-height:100vh;overflow-x:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:24px}
header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
header h1{font-size:24px;background:linear-gradient(90deg,var(--gold),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent}
.statusbar{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel)}
.pill.on{color:var(--green);border-color:rgba(62,207,142,.4)}
.pill.off{color:var(--red)}
nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
nav button{padding:10px 20px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--dim);cursor:pointer;font-size:14px;transition:.2s;backdrop-filter:blur(10px)}
nav button:hover{background:var(--panel2);color:var(--txt)}
nav button.active{background:linear-gradient(135deg,rgba(212,168,67,.18),rgba(139,108,240,.18));color:var(--txt);border-color:rgba(212,168,67,.4)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;backdrop-filter:blur(14px)}
.card h3{font-size:16px;margin-bottom:12px;color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{padding:9px 18px;border-radius:10px;border:none;cursor:pointer;font-size:14px;background:linear-gradient(135deg,var(--gold),#b0783a);color:#141020;font-weight:600;transition:.2s}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--border);font-weight:400}
.btn.small{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input,select{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--txt);font-size:14px;outline:none;width:100%}
input:focus{border-color:var(--purple)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:400;padding:8px;border-bottom:1px solid var(--border)}
td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;border:1px solid var(--border)}
.tag.g{color:var(--green);border-color:rgba(62,207,142,.4)}
.tag.p{color:var(--purple);border-color:rgba(139,108,240,.5)}
.tag.gold{color:var(--gold);border-color:rgba(212,168,67,.5)}
.tag.r{color:var(--red);border-color:rgba(240,96,108,.5)}
.tag.b{color:var(--blue);border-color:rgba(91,140,246,.5)}
.score{font-size:18px;font-weight:700;color:var(--gold)}
.cluster{border:1px solid var(--border);border-radius:12px;padding:14px;background:rgba(0,0,0,.2)}
.cluster .who{color:var(--purple);font-weight:600}
.progress-line{font-size:12px;color:var(--dim);padding:3px 0}
.progress-line b{color:var(--txt)}
.md{line-height:1.9;font-size:14px;white-space:pre-wrap}
.md h1,.md h2,.md h3{margin:14px 0 8px;color:var(--gold)}
.empty{color:var(--dim);text-align:center;padding:40px;font-size:14px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--dim);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,16,32,.95);border:1px solid var(--gold);padding:12px 24px;border-radius:12px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1}
.tab-sub{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab-sub button{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);cursor:pointer;font-size:12px}
.tab-sub button.active{color:var(--gold);border-color:var(--gold)}
.kw{display:inline-block;margin:4px;padding:5px 12px;border-radius:16px;font-size:12px;background:rgba(139,108,240,.12);border:1px solid rgba(139,108,240,.3)}
.kw.gold{background:rgba(212,168,67,.12);border-color:rgba(212,168,67,.3)}
.kw.b{background:rgba(91,140,246,.12);border-color:rgba(91,140,246,.3)}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
<header>
  <h1>🌌 GEO 通用行业内容工作台</h1>
  <div class="statusbar">
    <span class="pill" id="apiPill">检测中…</span>
    <span class="pill" id="cronPill">定时 -</span>
    <span class="pill" id="browserPill">浏览器 -</span>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="toast"></div>

<script>
// ================= 状态与工具（自包含引擎）=================
const MODULES=[['industry','① 行业配置'],['pain','② 痛点雷达'],['topics','③ 选题看板'],['content','④ 内容工厂'],['publish','⑤ 发布矩阵'],['review','⑥ 数据复盘']];
let cur='industry', state={industry:null,logins:null};
function $(s){return document.querySelector(s)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
async function api(p,opt){try{const r=await fetch('/api/'+p,opt);return await r.json()}catch(e){return{error:String(e)}}}
async function post(p,body){return api(p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})})}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md2html(md){return esc(md).replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<b style="color:var(--gold)">$1</b>').replace(/^[-*] (.*)$/gm,'• $1')}
function timeAgo(s){if(!s)return'';const d=(Date.now()-new Date(s))/1000;if(d<60)return'刚刚';if(d<3600)return Math.floor(d/60)+'分钟前';if(d<86400)return Math.floor(d/3600)+'小时前';return Math.floor(d/86400)+'天前'}

// ================= 轮询任务 =================
async function pollJob(id,doneMsg){
  for(let i=0;i<600;i++){
    const j=await api('jobs/'+id);
    if(j.status==='done'){toast('✅ '+doneMsg);return j.result}
    if(j.status==='error'){toast('❌ '+j.error);throw new Error(j.error)}
    await new Promise(r=>setTimeout(r,2000));
  }
  throw new Error('轮询超时');
}
async function runPipeline(ind){
  toast('🚀 全流程启动：采集→聚类→选题→母稿→审核→适配');
  const r=await post('pipeline',{industry:ind});
  if(r.error)return toast('❌ '+r.error);
  await pollJob(r.job_id,'全流程完成');
  render();
}

// ================= 模块①行业配置 =================
async function renderIndustry(){
  const inds=await api('industries');
  const plats=await api('platforms');
  return `<div class="card">
    <h3>新建行业 —— 只填一个词，其余全自动</h3>
    <div style="display:flex;gap:10px;max-width:560px">
      <input id="indInput" placeholder="输入行业，如：少儿编程 / 宠物医院 / 企业培训" style="flex:1">
      <button class="btn" id="indBtn" onclick="createIndustry()">启动全流程</button>
    </div>
    <p style="color:var(--dim);font-size:12px;margin-top:10px">系统将自动完成：百度下拉词痛点采集 → LLM痛点聚类 → 五层关键词地图 → 25分制选题评分 → 事实母稿 → 三闸审核 → 多平台适配 → 进入定时发布队列</p>
  </div>
  ${inds.length?`<div class="card"><h3>已有行业</h3><table><tr><th>行业</th><th>痛点簇</th><th>创建时间</th><th>操作</th></tr>
    ${inds.map(i=>`<tr><td><b>${esc(i.industry)}</b></td><td>${(i.clusters||[]).length} 个</td><td>${timeAgo(i.created_at)}</td>
    <td><button class="btn small ghost" onclick="runPipeline('${esc(i.industry)}')">重跑流水线</button> <button class="btn small ghost" onclick="cur='pain';state.industry='${esc(i.industry)}';render()">查看</button></td></tr>`).join('')}
  </table></div>`:''}
  <div class="card"><h3>发布平台（AI搜索高频引用源）</h3>
    <table><tr><th>平台</th><th>定位</th><th>启用</th></tr>
    ${plats.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td style="color:var(--dim);font-size:12px">${esc(p.style).slice(0,40)}…</td>
    <td><button class="btn small ${p.enabled?'':'ghost'}" onclick="togglePlat('${p.id}',this)">${p.enabled?'已启用 ✓':'启用'}</button></td></tr>`).join('')}
  </table></div>
  <div class="card"><h3>定时发布</h3>
    <div style="display:flex;gap:10px;max-width:560px">
      <input id="cronInput" placeholder="cron 表达式，如 0 9 * * *（每天9点）" value="">
      <button class="btn ghost" onclick="saveCron()">保存</button>
      <button class="btn" onclick="manualDaily()">立即跑一次每日任务</button>
    </div>
    <p style="color:var(--dim);font-size:12px;margin-top:8px">幂等键 = 行业+日期+选题+平台，同一天同一篇只发一次，失败可重试不会重发</p>
  </div>`;
}
async function createIndustry(){
  const v=$('#indInput').value.trim();if(!v)return toast('先输入行业');
  $('#indBtn').disabled=true;state.industry=v;
  try{
    const r=await post('industries',{industry:v});
    if(r.error){toast('❌ '+r.error);return}
    await runPipeline(v);
  }catch(e){toast('❌ 流水线中断: '+e.message)}
  finally{$('#indBtn')&&($('#indBtn').disabled=false)}
}
async function togglePlat(id,btn){const r=await post('platforms/toggle',{platform:id});if(r.error)toast('❌ '+r.error);else render()}
async function saveCron(){const v=$('#cronInput').value.trim();const r=await post('schedule',{cron:v});r.error?toast('❌ '+r.error):(toast('✅ 已保存 '+r.cron),health())}
async function manualDaily(){toast('⏳ 执行每日任务…');const r=await post('schedule/run');toast(r.error?'❌ '+r.error:'✅ '+JSON.stringify(r));render()}

// ================= 模块②痛点雷达 =================
async function renderPain(){
  const inds=await api('industries');
  if(!state.industry&&inds.length)state.industry=inds[inds.length-1].industry;
  const pains=(await api('painpoints')).filter(p=>!state.industry||p.industry===state.industry);
  const ind=inds.find(i=>i.industry===state.industry);
  const km=ind&&ind.keyword_map;
  return `<div class="card"><h3>痛点雷达 ${state.industry?'· '+esc(state.industry):''}</h3>
    <div class="tab-sub">${inds.map(i=>`<button class="${i.industry===state.industry?'active':''}" onclick="state.industry='${esc(i.industry)}';render()">${esc(i.industry)}</button>`).join('')}
    <button onclick="recollect()">＋ 追加采集</button></div>
    ${pains.length?`<p style="color:var(--dim);font-size:13px;margin-bottom:10px">共 ${pains.length} 条真实用户搜索问题（来源：百度下拉词，公开数据）</p>
    <div style="display:flex;flex-wrap:wrap;gap:4px">${pains.slice(0,80).map(p=>`<span class="kw">${esc(p.query)}</span>`).join('')}</div>`:'<div class="empty">暂无数据，先在①行业配置启动流程</div>'}
  </div>
  ${ind&&ind.clusters?`<div class="card"><h3>痛点簇（LLM聚类）</h3><div class="grid2">${ind.clusters.map(c=>`
    <div class="cluster"><div class="who">👤 ${esc(c.who)}</div>
    <div style="font-size:13px;margin:6px 0"><b>场景：</b>${esc(c.scenario)}<br><b>阻碍：</b>${esc(c.blocker)}<br><b>期望：</b>${esc(c.desired)}</div>
    <div style="font-size:12px;color:var(--dim)">原话示例：${(c.examples||[]).map(e=>'「'+esc(e)+'」').join(' ')}</div>
    </div>`).join('')}</div></div>`:''}
  ${km?`<div class="card"><h3>五层关键词地图</h3>
    <div style="margin-bottom:10px"><b style="color:var(--dim);font-size:12px">短尾类别词</b><br>${(km.shorttail||[]).map(k=>`<span class="kw gold">${esc(k)}</span>`).join('')}</div>
    <div style="margin-bottom:10px"><b style="color:var(--dim);font-size:12px">问题长尾词</b><br>${(km.longtail||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>
    <div style="margin-bottom:10px"><b style="color:var(--dim);font-size:12px">场景修饰词</b><br>${(km.modifier||[]).map(k=>`<span class="kw b">${esc(k)}</span>`).join('')}</div>
    <div><b style="color:var(--dim);font-size:12px">能力方案词</b><br>${(km.capability||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>
  </div>`:''}`;
}
async function recollect(){toast('⏳ 采集中…');const r=await post('collect',{industry:state.industry});if(r.error)return toast('❌ '+r.error);await pollJob(r.job_id,'采集完成');render()}

// ================= 模块③选题看板 =================
async function renderTopics(){
  const inds=await api('industries');
  if(!state.industry&&inds.length)state.industry=inds[inds.length-1].industry;
  const topics=(await api('topics')).filter(t=>!state.industry||t.industry===state.industry);
  const st={proposed:['提案中','b'],approved:['已批准','gold'],drafted:['已成稿','p'],published:['已发布','g']};
  return `<div class="card"><h3>选题看板 ${state.industry?'· '+esc(state.industry):''}（25分制评分：需求频率/痛苦强度/商业意图/内容缺口/事实合规）</h3>
  <div class="tab-sub">${inds.map(i=>`<button class="${i.industry===state.industry?'active':''}" onclick="state.industry='${esc(i.industry)}';render()">${esc(i.industry)}</button>`).join('')}</div>
  ${topics.length?`<table><tr><th>选题</th><th>人群/阶段</th><th>痛点</th><th>评分</th><th>状态</th><th>操作</th></tr>
  ${topics.sort((a,b)=>(b.total||0)-(a.total||0)).map(t=>`<tr>
    <td><b>${esc(t.topic)}</b><br><span style="font-size:11px;color:var(--dim)">${esc(t.industry)} · ${esc(t.primary_longtail||'')}</span></td>
    <td style="font-size:12px">${esc(t.audience||'')}<br><span class="tag b">${esc(t.stage||'')}</span></td>
    <td style="font-size:12px;max-width:220px">${esc(t.pain_point||'')}</td>
    <td><span class="score">${t.total||0}</span><span style="color:var(--dim);font-size:11px">/25</span><br>
      <span style="font-size:10px;color:var(--dim)">频${t.scores?.frequency??'-'} 痛${t.scores?.pain??'-'} 商${t.scores?.intent??'-'} 缺${t.scores?.gap??'-'} 证${t.scores?.evidence??'-'}</span></td>
    <td><span class="tag ${st[t.status]?.[1]||'b'}">${st[t.status]?.[0]||t.status}</span></td>
    <td><button class="btn small ghost" onclick="approveTopic('${t.id}')">${t.status==='approved'?'撤销批准':'批准'}</button>
    ${t.status!=='drafted'&&t.status!=='published'?`<button class="btn small" onclick="fullProduce('${t.id}')">⚡ 一键成稿</button>`:''}</td>
  </tr>`).join('')}</table>`:'<div class="empty">暂无选题</div>'}</div>`;
}
async function approveTopic(id){await post(`topics/${id}/approve`);render()}
async function fullProduce(id){
  toast('✍️ 一键成稿：母稿→三闸审核→全平台适配…');
  const r=await post(`articles/${id}/full`);
  if(r.error)return toast('❌ '+r.error);
  try{
    const result=await pollJob(r.job_id,'成稿完成');
    if(result&&result.article_id){curArticle=result.article_id;curVersion=null;toast('✅ 成稿完成，已切换到内容工厂')}
    cur='content';render();
  }catch(e){toast('❌ '+e.message)}
}

// ================= 模块④内容工厂 =================
let curArticle=null,curVersion=null;
async function renderContent(){
  const inds=await api('industries');
  if(!state.industry&&inds.length)state.industry=inds[inds.length-1].industry;
  const arts=(await api('articles')).filter(x=>!state.industry||x.industry===state.industry);
  if(curArticle&&!arts.find(x=>x.id===curArticle))curArticle=null;
  if(!curArticle&&arts.length)curArticle=arts[arts.length-1].id;
  const a=arts.find(x=>x.id===curArticle)||arts[arts.length-1];
  const rv=a&&a.reviews;
  const plats=await api('platforms');
  const pname=Object.fromEntries(plats.map(p=>[p.id,p.name]));
  return `<div class="card"><h3>内容工厂 ${state.industry?'· '+esc(state.industry):''}</h3>
  <div class="tab-sub">${inds.map(i=>`<button class="${i.industry===state.industry?'active':''}" onclick="state.industry='${esc(i.industry)}';render()">${esc(i.industry)}</button>`).join('')}</div>
  ${!a?'<div class="empty">暂无文章，去选题看板写母稿</div>':`
  <div class="tab-sub">${arts.map(x=>`<button class="${x.id===a.id?'active':''}" onclick="curArticle='${x.id}';render()">${esc(x.title.slice(0,18))}</button>`).join('')}</div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
    ${a.status==='drafted'?`<button class="btn" onclick="doReview('${a.id}')">🔍 三闸审核</button>`:''}
    <button class="btn ghost" onclick="doHumanize('${a.id}')">🧹 去AI味${a.humanize?` (${a.humanize.score_after??a.humanize.ai_score??'?'}分)`:''}</button>
    ${rv?`<button class="btn ghost" onclick="doAdapt('${a.id}')">📤 生成平台适配版</button>`:''}
    ${a.status==='adapted'?`<button class="btn" style="background:linear-gradient(135deg,#7c3aed,#d97706)" onclick="publishAll('${a.id}')">⚡ 一键发布(全平台)</button>`:''}
    <span class="tag ${rv?(rv.verdict?'g':'r'):'b'}" style="margin-left:auto">${rv?(rv.verdict?'✅ 三闸全过':'⚠️ 审核未过'):'待审核'}</span>
  </div>
  ${a.humanize?`<div class="cluster" style="margin-bottom:14px"><b>🧹 AI味检测</b> ${a.humanize.rewritten?`<span class="tag g">${a.humanize.score_before}→${a.humanize.score_after}分 已改写</span>`:`<span class="tag b">${a.humanize.note||'干净'}</span>`}
  ${(a.humanize.report?.hits||[]).length?`<details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--dim)">命中AI指纹 ${a.humanize.report.hits.length} 处${a.humanize.changes?.length?` · 改动 ${a.humanize.changes.length} 项`:''}</summary>
  ${(a.humanize.report.hits||[]).map(h=>`<p style="font-size:12px;margin-top:6px"><span class="tag ${h.severity==='高'?'r':h.severity==='中'?'gold':'b'}">${h.severity==='高'?'🔴':h.severity==='中'?'⚠️':'💡'} ${esc(h.feature)}</span> <span style="color:var(--dim)">${esc((h.quote||'').slice(0,60))}</span></p>`).join('')}
  ${(a.humanize.changes||[]).map(c=>`<p style="font-size:12px;color:var(--gold);margin-top:4px">✏️ ${esc(c)}</p>`).join('')}
  </details>`:''}</div>`:''}
  ${rv?`<div class="grid3" style="margin-bottom:14px">
    <div class="cluster"><b>合规闸</b> ${rv.compliance?.pass?'<span class="tag g">通过</span>':'<span class="tag r">未过</span>'}<br><span style="font-size:12px;color:var(--dim)">${(rv.compliance?.issues||[]).join('；')||'无问题'}</span></div>
    <div class="cluster"><b>事实闸</b> ${rv.facts?.pass?'<span class="tag g">通过</span>':'<span class="tag r">未过</span>'}<br><span style="font-size:12px;color:var(--dim)">${(rv.facts?.issues||[]).join('；')||'无杜撰'}</span></div>
    <div class="cluster"><b>调性闸</b> ${rv.tone?.pass?'<span class="tag g">通过</span>':'<span class="tag r">未过</span>'} ${rv.tone?.score??''}/10<br><span style="font-size:12px;color:var(--dim)">${(rv.tone?.issues||[]).join('；')||'调性正常'}</span></div>
  </div>${rv.advice?`<p style="font-size:12px;color:var(--gold);margin-bottom:12px">💡 ${esc(rv.advice)}</p>`:''}`:''}
  <div class="grid2">
    <div><h3 style="font-size:14px">母稿</h3>
      <div style="background:rgba(0,0,0,.25);border-radius:12px;padding:16px;max-height:520px;overflow:auto">
      <b style="font-size:15px">${esc(a.title)}</b>
      <p style="font-size:12px;color:var(--dim);margin:6px 0 12px">${esc(a.summary||'')}</p>
      <div class="md">${md2html(a.body_md||'')}</div>
      ${a.qa&&a.qa.length?`<hr style="border-color:var(--border);margin:14px 0"><b style="color:var(--gold);font-size:13px">AI引用问答块</b>${a.qa.map(q=>`<p style="font-size:13px;margin-top:8px"><b>Q：${esc(q.q)}</b><br>A：${esc(q.a)}</p>`).join('')}`:''}
      </div></div>
    <div><h3 style="font-size:14px">平台适配版</h3>
    ${Object.keys(a.versions||{}).length?`<div class="tab-sub">${Object.entries(a.versions).map(([pid,v])=>`<button class="${curVersion===pid?'active':''}" onclick="curVersion='${pid}';render()">${esc(pname[pid]||pid)} ${v.status==='ready'?'✓':'✗'}</button>`).join('')}</div>
    ${(()=>{const pid=curVersion&&a.versions[curVersion]?curVersion:Object.keys(a.versions)[0];const v=a.versions[pid];if(!v)return'';return v.status!=='ready'?`<div class="empty">适配失败：${esc(v.error)}</div>`:`
    <div style="background:rgba(0,0,0,.25);border-radius:12px;padding:16px;max-height:480px;overflow:auto">
    <b>${esc(v.title)}</b><div class="md" style="margin-top:10px">${md2html(v.body_md||'')}</div>
    <button class="btn" style="margin-top:14px" onclick="publishOne('${a.id}','${pid}')">🚀 提交发布</button></div>`})()}`
    :'<div class="empty">点击「生成平台适配版」</div>'}
    </div>
  </div>`}</div>`;
}
async function doReview(id){toast('🔍 三闸审核中…');const r=await post(`articles/${id}/review`);if(r.error)return toast('❌ '+r.error);await pollJob(r.job_id,'审核完成');render()}
async function doHumanize(id){toast('🧹 检测AI指纹中…');const r=await post(`articles/${id}/humanize`);if(r.error)return toast('❌ '+r.error);try{await pollJob(r.job_id,'去AI味完成');render()}catch(e){toast('❌ '+e.message)}}
async function doAdapt(id){toast('📤 生成平台适配版…');const r=await post(`articles/${id}/adapt`);if(r.error)return toast('❌ '+r.error);await pollJob(r.job_id,'适配完成');render()}
async function publishOne(aid,pid){toast('🚀 真实发布中，浏览器会自动打开平台页面…');const r=await post('publish',{article_id:aid,platform:pid});toast(r.error?'❌ '+r.error:(r.already_published?'⚠️ 今天已发布过（幂等拦截）':(r.status==='published'?'✅ 发布成功'+(r.url?' ':''):(r.status==='sent_unverified'?'⚠️ 已发送，需到平台主页核验是否落地':'⚠️ '+esc(r.detail||'需人工确认')))))}
async function publishAll(aid){toast('🚀 一键发布：逐个已登录平台真实发布中，别关浏览器…');try{const r=await post('publish-all',{article_id:aid});if(r.error)return toast('❌ '+r.error);await pollJob(r.job_id,'一键发布完成');render()}catch(e){toast('❌ '+e.message)}}

// ================= 模块⑤发布矩阵 =================
async function renderPublish(){
  const logins=await api('logins');
  const log=await api('publish-log');
  const queue=await api('publish-queue');
  const plats=await api('platforms');
  const pname=Object.fromEntries(plats.map(p=>[p.id,p.name]));
  const lr=logins&&logins.results?logins:{};
  const loginMap=Object.fromEntries((lr.results||[]).map(r=>[r.platform,r]));
  return `<div class="card"><h3>发布矩阵 · 浏览器与登录态</h3>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn" onclick="launchBrowser()">🌐 启动GEO浏览器</button>
      <button class="btn ghost" onclick="checkLogins()">🔎 核验登录态</button>
      <span style="font-size:12px;color:var(--dim);margin-left:auto;align-self:center">核验时间：${timeAgo(lr.at)}</span>
    </div>
    <div class="grid3">${plats.map(p=>{const l=loginMap[p.id];return `<div class="cluster">
      <b>${esc(p.name)}</b> ${l?(l.login?'<span class="tag g">已登录</span>':'<span class="tag r">未登录</span>'):'<span class="tag b">未核验</span>'}
      ${l&&l.detail?`<div style="font-size:11px;color:var(--dim)">${esc(l.detail).slice(0,70)}</div>`:''}
      ${l&&l.error?`<div style="font-size:11px;color:var(--dim)">${esc(l.error).slice(0,60)}</div>`:''}
    </div>`}).join('')}</div>
    <p style="font-size:12px;color:var(--dim);margin-top:10px">💡 首次使用：点「启动GEO浏览器」→ 在弹出的浏览器里把需要的平台登录一遍（只需一次，登录态会保存）→ 点「核验登录态」确认</p>
  </div>
  <div class="card"><h3>发布记录（幂等日志）</h3>
  ${log.length?`<table><tr><th>时间</th><th>文章</th><th>平台</th><th>幂等键</th><th>状态</th></tr>
  ${log.map(l=>`<tr><td>${timeAgo(l.at)}</td><td style="max-width:240px">${esc(l.title)}</td><td>${esc(pname[l.platform]||l.platform)}</td><td style="font-size:11px;color:var(--dim)">${esc(l.idem)}</td><td><span class="tag ${l.status==='published'?'g':'gold'}">${esc(l.status)}</span></td></tr>`).join('')}</table>`:'<div class="empty">暂无发布记录</div>'}</div>
  <div class="card"><h3>发布队列</h3>
  ${queue.length?`<table><tr><th>文章ID</th><th>行业</th><th>目标平台</th><th>状态</th></tr>
  ${queue.map(q=>`<tr><td>${esc(q.article_id)}</td><td>${esc(q.industry)}</td><td>${q.platforms.map(p=>esc(pname[p]||p)).join('、')}</td><td><span class="tag gold">${esc(q.status)}</span></td></tr>`).join('')}</table>`:'<div class="empty">队列为空</div>'}</div>`;
}
async function launchBrowser(){toast('🌐 启动浏览器…');const r=await post('browser/launch');toast(r.error?'❌ '+r.error:'✅ 浏览器已就绪，请登录后核验')}
async function checkLogins(){toast('🔎 逐平台核验登录态…');const r=await post('logins/check');if(r.error)return toast('❌ '+r.error);toast('✅ 核验完成');render()}

// ================= 模块⑥数据复盘 =================
async function renderReview(){
  const arts=await api('articles');const topics=await api('topics');const log=await api('publish-log');const jobs=await api('jobs');
  const reviewed=arts.filter(a=>a.reviews);
  const passRate=reviewed.length?Math.round(reviewed.filter(a=>a.reviews.verdict).length/reviewed.length*100):0;
  return `<div class="grid3">
    <div class="card" style="text-align:center"><div class="score" style="font-size:36px">${topics.length}</div><div style="color:var(--dim)">累计选题</div></div>
    <div class="card" style="text-align:center"><div class="score" style="font-size:36px">${arts.length}</div><div style="color:var(--dim)">产出母稿</div></div>
    <div class="card" style="text-align:center"><div class="score" style="font-size:36px">${passRate}%</div><div style="color:var(--dim)">三闸审核通过率</div></div>
  </div>
  <div class="card"><h3>流水线任务日志</h3>
  ${jobs.length?`<table><tr><th>任务</th><th>状态</th><th>开始</th><th>步骤明细</th></tr>
  ${jobs.slice(0,12).map(j=>`<tr><td>${esc(j.name)}</td>
  <td><span class="tag ${j.status==='done'?'g':j.status==='error'?'r':'gold'}">${j.status==='running'?'<span class=spin></span>':''}${j.status==='done'?'完成':j.status==='error'?'失败':'运行中'}</span></td>
  <td style="font-size:12px">${timeAgo(j.started_at)}</td>
  <td style="font-size:11px;color:var(--dim)">${(j.progress||[]).slice(-3).map(p=>esc(p.step)+'：'+esc(p.detail)).join(' → ')||esc(j.error||'')}</td></tr>`).join('')}</table>`:'<div class="empty">暂无任务</div>'}</div>
  <div class="card"><h3>审核明细</h3>
  ${reviewed.length?`<table><tr><th>文章</th><th>合规</th><th>事实</th><th>调性</th><th>结论</th></tr>
  ${reviewed.map(a=>`<tr><td style="max-width:260px">${esc(a.title)}</td>
  <td>${a.reviews.compliance?.pass?'✅':'❌'}</td><td>${a.reviews.facts?.pass?'✅':'❌'}</td>
  <td>${a.reviews.tone?.score??'-'}/10</td><td>${a.reviews.verdict?'<span class="tag g">通过</span>':'<span class="tag r">打回</span>'}</td></tr>`).join('')}</table>`:'<div class="empty">暂无审核记录</div>'}</div>`;
}

// ================= 路由与状态条 =================
const RENDER={industry:renderIndustry,pain:renderPain,topics:renderTopics,content:renderContent,publish:renderPublish,review:renderReview};
async function render(){
  $('#nav').innerHTML=MODULES.map(([k,n])=>`<button class="${k===cur?'active':''}" onclick="cur='${k}';render()">${n}</button>`).join('');
  $('#main').innerHTML='<div class="card"><div class="spin"></div> 加载中…</div>';
  try{$('#main').innerHTML=await RENDER[cur]()}catch(e){$('#main').innerHTML=`<div class="card" style="color:var(--red)">渲染出错：${esc(e.message||e)}</div>`}
}
async function health(){
  const h=await api('health');
  $('#apiPill').textContent=h.apiConfigured?'模型已连接 · '+h.model:'未配置模型';
  $('#apiPill').className='pill '+(h.apiConfigured?'on':'off');
  $('#cronPill').textContent='⏰ '+(h.cron||'-');
  $('#browserPill').textContent=h.browser?'🌐 浏览器在线':'🌐 浏览器未启动';
  $('#browserPill').className='pill '+(h.browser?'on':'off');
}
// 星空背景
(function(){const c=$('#bgCanvas'),x=c.getContext('2d');let stars=[];
function rs(){c.width=innerWidth;c.height=innerHeight;stars=Array.from({length:90},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.4+.3,s:Math.random()*.4+.1,a:Math.random()}))}
rs();addEventListener('resize',rs);
(function loop(){x.clearRect(0,0,c.width,c.height);
const g=x.createRadialGradient(c.width*.8,c.height*.15,0,c.width*.8,c.height*.15,500);
g.addColorStop(0,'rgba(139,108,240,.07)');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
for(const st of stars){st.a+=.01*st.s*10;if(st.a>1)st.a=0;st.y-=st.s;if(st.y<0)st.y=c.height;
x.beginPath();x.arc(st.x,st.y,st.r,0,7);x.fillStyle=`rgba(220,215,255,${Math.sin(st.a*Math.PI)*.6})`;x.fill()}
requestAnimationFrame(loop)})()})();
// file:// 自愈横幅
if(location.protocol==='file:'){document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;top:0;left:0;right:0;z-index:100;background:#f0606c;color:#fff;text-align:center;padding:10px;font-size:14px">⚠ 文件方式打开无法连接服务 — 请访问 <a href="http://127.0.0.1:8030" style="color:#fff;font-weight:700">http://127.0.0.1:8030</a></div>')}
setInterval(health,8000);health();render();
</script>
